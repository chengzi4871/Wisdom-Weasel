name: Build Wisdom-Weasel Installer

on:
  workflow_dispatch:
    inputs:
      installer_backend:
        description: '安装器封装方式；auto 优先 NSIS，缺少时回退 IExpress'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - nsis
          - iexpress

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure build environment
        shell: pwsh
        run: Copy-Item -LiteralPath env.vs2022.bat -Destination env.bat -Force

      - name: Fetch plum recipe manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath plum) -or !(Test-Path -LiteralPath (Join-Path $PWD 'plum\rime-install'))) {
            git clone --depth 1 https://github.com/rime/plum.git plum
          }

      - name: Prepare generated directories and llama.cpp headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # get-rime.ps1 只有在 output\Win32 已存在时才会把 librime 的开发文件复制进来。
          New-Item -ItemType Directory -Force -Path output\Win32 | Out-Null
          # 仓库只提交了 llama/ggml 的导入库，头文件由构建时固定从上游获取。
          if (!(Test-Path -LiteralPath (Join-Path $PWD 'llamatest\llama.cpp\include\llama.h'))) {
            New-Item -ItemType Directory -Force -Path llamatest | Out-Null
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llamatest\llama.cpp
          }

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install and build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call install_boost.bat
          if errorlevel 1 exit /b 1
          call build.bat boost arm64
          if errorlevel 1 exit /b 1

      - name: Load MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.19041.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Rime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build llama.cpp runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 使用与源码完全匹配的 llama/ggml 头文件和 DLL；不能只依赖仓库中可能过期的导入库。
          cmake -S llamatest\llama.cpp -B llamatest\build -G 'Visual Studio 17 2022' -A x64 `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF `
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_NATIVE=OFF -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON
          if ($LASTEXITCODE -ne 0) { throw 'llama.cpp CMake 配置失败。' }
          cmake --build llamatest\build --config Release --target llama -- /m
          if ($LASTEXITCODE -ne 0) { throw 'llama.cpp 编译失败。' }

          $libNames = @('llama.lib', 'ggml.lib', 'ggml-base.lib')
          foreach ($name in $libNames) {
            $source = Get-ChildItem -LiteralPath llamatest\build -Recurse -File -Filter $name |
              Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
            if (!$source) { throw "llama.cpp 构建缺少导入库：$name" }
            Copy-Item -LiteralPath $source.FullName -Destination (Join-Path lib64 $name) -Force
          }
          $dllNames = @('llama.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu.dll')
          foreach ($name in $dllNames) {
            $source = Get-ChildItem -LiteralPath llamatest\build -Recurse -File -Filter $name |
              Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
            if ($source) { Copy-Item -LiteralPath $source.FullName -Destination (Join-Path output $name) -Force }
          }

      - name: Build Rime data
        shell: cmd
        run: |
          call build.bat data
          if errorlevel 1 exit /b 1

      - name: Build Weasel runtime and Alpha core
        shell: cmd
        run: |
          set SDKVER=10.0.19041.0
          rem 当前运行时依赖和导入库均为 x64；先生成可在普通 x64 Windows 上使用的安装器。
          call build.bat x64
          if errorlevel 1 exit /b 1

      - name: Build Alpha input DLL and its native runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path third_party/alpha-input/Cargo.toml
          $alphaDir = 'third_party/alpha-input/target/release'
          $requiredFiles = @('alpha_input.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')
          foreach ($file in $requiredFiles) {
            $path = Join-Path $alphaDir $file
            if (!(Test-Path -LiteralPath $path)) {
              throw "Alpha 构建缺少运行时文件：$path"
            }
          }

      - name: Build Wisdom-Weasel installer bundle
        shell: pwsh
        env:
          INSTALLER_BACKEND: ${{ inputs.installer_backend }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\Build-ReleaseBundle.ps1 -InstallerBackend $env:INSTALLER_BACKEND

      - name: Upload Wisdom-Weasel installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisdom-weasel-installer-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            archives/Wisdom-Weasel-installer-*.exe
            archives/Wisdom-Weasel-bootstrap-*.zip
            archives/Wisdom-Weasel-runtime-*.zip
            archives/Wisdom-Weasel-release-assets-*.txt
